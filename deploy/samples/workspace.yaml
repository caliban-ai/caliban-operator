apiVersion: caliban.caliban-ai.dev/v1alpha1
kind: Workspace
metadata:
  name: team-a-ws
  namespace: team-a
spec:
  displayName: Team A
  sources:
    - { name: caliban, repo: "git@example:caliban", ref: main, path: /work/caliban }
  providers:
    - name: planner
      kind: anthropic
      model: claude-opus-4-8
      credentialsRef: { secretName: anthropic-key, key: api-key }
    - name: workers
      kind: openai
      baseUrl: "http://192.168.1.240:9292/v1"
      model: qwen2.5-coder
  defaultProvider: planner
  # Optional agent policy (#80, ADR 0006). allowUnattended admits tasks with
  # permissionPosture: unattended; whoever can edit this Workspace controls it.
  # agentPolicy: { allowUnattended: true }
  #
  # The typed permission settings (#51) replace spelling these as raw `env`
  # entries, and win over an `env` entry of the same name. Each is optional:
  # an unset field leaves caliban's own default alone.
  # agentPolicy:
  #   permissionMode: acceptEdits   # default|acceptEdits|plan|auto|dontAsk|bypassPermissions
  #
  # dontAsk, bypassPermissions, autoAllow and noPermissions leave no human
  # answering prompts, so they need allowUnattended as well (ADR 0006,
  # decision 7) — without it the task is denied before it starts.
  # agentPolicy:
  #   allowUnattended: true
  #   permissionMode: bypassPermissions
  #   autoAllow: true
  #   noPermissions: false
  #
  # The extension settings (#87) narrow what an agent can reach. They reduce
  # surface rather than granting power, so they need no allowUnattended.
  # agentPolicy:
  #   noMcp: true                    # no MCP server discovery
  #   noHooks: true                  # no external hook handlers
  #   noSkills: true                 # no skill discovery
  #   noSubAgent: true               # agents cannot spawn sub-agents
  #   strictKnownMarketplaces: true  # refuse unrecognized marketplaces
  #   blockedMarketplaces: [sketchy]
  #   parallelToolLimit: 4           # at least 1; caliban refuses 0
  #
  # enabledPlugins is an allow-list: everything else is disabled. An empty
  # list enables none, which is NOT the same as omitting the field — omitted
  # enables every plugin caliban discovers.
  #   enabledPlugins: [review, deploy]
  #   enabledPlugins: []             # enable no plugins at all
