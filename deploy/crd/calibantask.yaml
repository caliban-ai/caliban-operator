apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: calibantasks.caliban.caliban-ai.dev
spec:
  group: caliban.caliban-ai.dev
  names:
    categories: []
    kind: CalibanTask
    plural: calibantasks
    shortNames:
    - ctask
    singular: calibantask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.permissionPosture
      name: Posture
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CalibanTaskSpec via `CustomResource`
        properties:
          spec:
            description: 'Desired state of a caliban task: a workspace of sources + the task to run.'
            properties:
              isolation:
                description: Sandbox isolation configuration.
                nullable: true
                properties:
                  runtimeClass:
                    description: RuntimeClass (e.g. `gvisor`, `kata`).
                    nullable: true
                    type: string
                  worktrees:
                    description: Worktree isolation strategy (e.g. `per-source`).
                    nullable: true
                    type: string
                type: object
              lifecycle:
                description: Idle/drain lifecycle policy.
                nullable: true
                properties:
                  idleTimeout:
                    description: Idle timeout before pause (e.g. `30m`).
                    nullable: true
                    type: string
                  onDelete:
                    description: 'On delete: `checkpoint` or `delete`.'
                    nullable: true
                    type: string
                type: object
              model:
                description: Model-router configuration.
                nullable: true
                properties:
                  routerConfigRef:
                    description: |-
                      Name of a ConfigMap (same namespace) holding the model router config
                      under the key `caliban.toml`. Mounted read-only into the sandbox and
                      handed to caliban as `CALIBAN_ROUTER_CONFIG`.
                    nullable: true
                    type: string
                type: object
              providerRef:
                description: |-
                  Which of the workspace's providers to bind; defaults to the workspace's
                  `defaultProvider` (or its sole provider).
                nullable: true
                type: string
              resources:
                description: 'Resource class → a SandboxTemplate (consumed in #283).'
                nullable: true
                properties:
                  class:
                    description: Named resource class (e.g. `standard`).
                    nullable: true
                    type: string
                type: object
              state:
                description: Persistence (gonzalo) configuration.
                nullable: true
                properties:
                  gonzaloEndpoint:
                    description: |-
                      gonzalod URL the task's agents use for shared state (e.g.
                      `http://gonzalod.storage.svc:8080`). Setting it selects remote storage
                      unless `mode` says `local`.
                    nullable: true
                    type: string
                  mode:
                    description: |-
                      `remote` (shared gonzalod) or `local` (in-pod filesystem). Defaults to
                      `remote` when `gonzaloEndpoint` is set.
                    nullable: true
                    type: string
                  tokenRef:
                    description: |-
                      Secret holding the gonzalod bearer token, projected into the pod as
                      `GONZALO_TOKEN`. Requires remote storage. caliban-memory and
                      caliban-sessions write to the gonzalod `caliban` namespace, so use a
                      principal with read/write on `caliban` only and no write on `fleet` or
                      `fleet-audit`.
                    nullable: true
                    properties:
                      key:
                        description: Key within the Secret's data.
                        minLength: 1
                        type: string
                      secretName:
                        description: Name of the Secret (same namespace).
                        minLength: 1
                        type: string
                    required:
                    - key
                    - secretName
                    type: object
                type: object
              task:
                description: The task itself.
                properties:
                  agentType:
                    description: Agent type (e.g. `general-purpose`).
                    nullable: true
                    type: string
                  interactive:
                    description: |-
                      Run the agent in interactive mode: it awaits operator input at each
                      end-of-run instead of finishing. The operator only carries this through
                      to the CR — prospero reads it back and sets `SpawnSpec.interactive` on
                      the pod caliband itself (prospero#163).
                    nullable: true
                    type: boolean
                  permissionPosture:
                    description: |-
                      How the task's agents handle a permission prompt: `supervised` (the
                      default) sends it to a human to answer; `unattended` runs under a bypass
                      profile and is only admitted when the Workspace's `agentPolicy` sets
                      `allowUnattended`. Unset means `supervised`.
                    enum:
                    - supervised
                    - unattended
                    nullable: true
                    type: string
                  prompt:
                    description: Initial prompt.
                    minLength: 1
                    type: string
                required:
                - prompt
                type: object
              tools:
                description: Per-run tool override (allow-list) for this task's agents.
                items:
                  type: string
                nullable: true
                type: array
              workspaceRef:
                description: Reference to the namespace-local `Workspace` this task runs against.
                properties:
                  name:
                    description: Workspace object name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - task
            - workspaceRef
            type: object
          status:
            description: Observed state of a `CalibanTask`.
            nullable: true
            properties:
              calibandEndpoint:
                description: caliband session endpoint (host:port), once the Sandbox is ready.
                nullable: true
                type: string
              checkpointRef:
                description: Latest checkpoint reference.
                nullable: true
                type: string
              conditions:
                description: Standard Kubernetes conditions.
                items:
                  description: A minimal Kubernetes-style condition.
                  properties:
                    message:
                      description: Human-readable message.
                      nullable: true
                      type: string
                    reason:
                      description: Machine-readable reason.
                      nullable: true
                      type: string
                    status:
                      description: '`True` / `False` / `Unknown`.'
                      type: string
                    type:
                      description: Condition type (e.g. `Ready`).
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              permissionPosture:
                description: |-
                  The permission posture the task was admitted with, so an unattended
                  session is visible from `kubectl get`.
                enum:
                - supervised
                - unattended
                nullable: true
                type: string
              phase:
                default: Pending
                description: Lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Running
                - Draining
                - Completed
                - Failed
                type: string
              resolvedWorkspace:
                description: |-
                  Resolved workspace config, pinned at admission (immutable run). Set once;
                  later `Workspace` edits don't re-pin a running task.
                nullable: true
                properties:
                  agentPolicy:
                    description: Workspace agent policy, if any.
                    nullable: true
                    properties:
                      allowUnattended:
                        default: false
                        description: |-
                          Admit tasks whose `permissionPosture` is `unattended`, which run under
                          a bypass profile with no human answering permission prompts. Defaults
                          to false. Whoever can edit this Workspace controls it, so limit who has
                          write access to Workspaces.
                        type: boolean
                    type: object
                  egress:
                    description: Workspace egress restriction, if any.
                    nullable: true
                    properties:
                      allow:
                        default: []
                        description: |-
                          Destinations agent pods may reach besides DNS. This list replaces the
                          default allow-all egress: include the workspace's git remotes, its model
                          provider endpoints, and gonzalod if used. An empty list allows DNS only.
                        items:
                          description: One allowed egress destination.
                          properties:
                            cidr:
                              description: Destination CIDR, e.g. `192.0.2.0/24` or `2001:db8::/32`.
                              minLength: 1
                              type: string
                            ports:
                              description: TCP ports allowed to that CIDR. Empty allows every port.
                              items:
                                format: int32
                                type: integer
                              type: array
                          required:
                          - cidr
                          type: object
                        type: array
                    type: object
                  env:
                    description: Non-secret env from the workspace.
                    items:
                      description: A non-secret environment entry.
                      properties:
                        name:
                          description: Variable name.
                          minLength: 1
                          type: string
                        value:
                          description: Variable value.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  isolation:
                    description: Workspace default isolation.
                    nullable: true
                    properties:
                      runtimeClass:
                        description: RuntimeClass (e.g. `gvisor`, `kata`).
                        nullable: true
                        type: string
                      worktrees:
                        description: Worktree isolation strategy (e.g. `per-source`).
                        nullable: true
                        type: string
                    type: object
                  provider:
                    description: The single provider this task binds to.
                    properties:
                      baseUrl:
                        description: Base URL, if set.
                        nullable: true
                        type: string
                      credentialsRef:
                        description: Credential Secret reference, if the provider needs one.
                        nullable: true
                        properties:
                          key:
                            description: Key within the Secret's data.
                            minLength: 1
                            type: string
                          secretName:
                            description: Name of the Secret (same namespace).
                            minLength: 1
                            type: string
                        required:
                        - key
                        - secretName
                        type: object
                      kind:
                        description: Provider kind.
                        type: string
                      model:
                        description: Model, if set.
                        nullable: true
                        type: string
                      name:
                        description: Provider name.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  sources:
                    description: The workspace's source checkouts.
                    items:
                      description: A single source checkout in the workspace.
                      properties:
                        name:
                          description: Source identifier (matches caliband's workspace source name).
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            Absolute checkout path in the pod (e.g. `/work/caliban`). Must be a
                            directory strictly under the operator's workspace root (default
                            `/work`) and distinct from every other source's path; otherwise the
                            Workspace goes `Failed`, since a checkout outside the persistent volume
                            is lost on every restart.
                          minLength: 1
                          type: string
                        ref:
                          default: main
                          description: Git ref to check out. Defaults to `main`.
                          type: string
                        repo:
                          description: Git remote to clone.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - path
                      - repo
                      type: object
                    type: array
                required:
                - provider
                - sources
                type: object
              sandboxRef:
                description: The agent-sandbox Sandbox backing this task.
                nullable: true
                properties:
                  name:
                    description: Object name.
                    type: string
                required:
                - name
                type: object
            type: object
        required:
        - spec
        title: CalibanTask
        type: object
    served: true
    storage: true
    subresources:
      status: {}
